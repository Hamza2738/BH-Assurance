<div class="container-fluid">
  <div class="authentication-main">
    <div class="row">
      <div class="col-md-12 p-0">
        <div class="auth-innerright">
          <div class="authentication-box">
            <div class="text-center"><img src="assets/images/bh1.png" alt=""></div>
            <div class="card mt-4 p-4">
              <form (ngSubmit)="onSubmit()" class="theme-form">
                <h5 class="f-16 mb-3 f-w-600">CREATE YOUR PASSWORD</h5>
                <div class="form-group">
                  <label class="col-form-label">New Password</label>
                  <input class="form-control" type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="*****" required>
                </div>
                <div class="form-group">
                  <label class="col-form-label">Retype Password</label>
                  <input class="form-control" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="*****" required>
                </div>
                <div class="form-group row mb-0">
                  <div class="col-md-4">
                    <button class="btn btn-primary" type="submit">Done</button>
                  </div>
                </div>
              </form>
              <div *ngIf="message" class="mt-3 alert alert-info">{{ message }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
